spring:
  datasource:
    url: jdbc:h2:mem:test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
#        show_sql: true
        format_sql: true


cloud:
  aws:
    s3:
      bucket: my-bucket
      base-url: http://test.com

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace