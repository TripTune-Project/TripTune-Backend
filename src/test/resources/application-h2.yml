spring:
  config:
    activate:
      on-profile: h2

  datasource:
    url: jdbc:h2:mem:test
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
#        show_sql: true
        format_sql: true

  jwt:
    secret: testsecretkeyforjwttestonly123456789101112131415
    token:
      access-expiration-time: 3600000
      refresh-expiration-time: 604800000
      password-expiration-time: 3600000

  redis:
    data:
      host: localhost
      port: 6379

  mail:
    host: test
    port: 587
    username: test@test.com
    password: test
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
            required: false
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: dummy-naver-client-id
            client-secret: dummy-naver-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            client-name: Naver
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

cloud:
  aws:
    s3:
      bucket: test
      base-url: http://test.com
    credentials:
      access-key: test-access-key
      secret-key: test-secret-key
    region:
      static: ap-northeast-2

app:
  domain: test.com
  frontend:
    main:
      url: http://test.com
    change-password:
      url: http://test.com/change-password?passwordToken=
    404-error:
      url: ttp://test.com/404

  backend:
    email:
      certification-duration: 300
      verification-duration: 900
      reset-password-duration: 3600
    cors:
      allowed-origins:
        - http://localhost:3000
        - http://test.com

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type: trace