spring:
  config:
    activate:
      on-profile: prod

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT}/triptune?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}

  data:
    mongodb:
      uri: ${MONGODB_URI}

  redis:
    data:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connection-timeout: 5000
          timeout: 5000
          write-timeout: 5000
    auth-code-expiration-millis: 1800000

  jwt:
    secret: ${JWT_SECRET}
    token:
      access-expiration-time: 3600000       # 1시간
      refresh-expiration-time: 604800000    # 7일
      password-expiration-time: 3600000     # 1시간

  security:
    oauth2:
      client:
        registration:
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_PASSWORD}
            scope:
              - email
            client-name: Naver
            authorization-grant-type: authorization_code
            redirect-uri: ${NAVER_REDIRECT_URI}
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            client-authentication-method: client_secret_post
            scope:
              - account_email
            client-name: kakao
            authorization-grant-type: authorization_code
            redirect-uri: ${KAKAO_REDIRECT_URI}
        provider:
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            user-name-attribute: id
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me

cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET}
      base-url: ${S3_BASE_URL}
    stack:
      auto: false
    region:
      static: ap-northeast-2
    credentials:
      access-key: ${AWS_ACCESS_KEY}
      secret-key: ${AWS_SECRET_KEY}

server:
  servlet:
    session:
      cookie:
        domain: triptune.co.kr
        http-only: true
        secure: true
        same-site: none

app:
  domain: triptune.co.kr

  frontend:
    main:
      url: https://triptune.co.kr
    change-password:
      url: https://triptune.co.kr/Find/ChangePassword?passwordToken=
    404-error:
      url: https://triptune.co.kr/404

  backend:
    email:
      certification-duration: 300       # 3분
      verification-duration: 900        # 15분
      reset-password-duration: 3600     # 1시간
    default-profile:
      s3-object-url: ${DEFAULT_PROFILE_S3_OBJECT_URL}
      s3-object-key: ${DEFAULT_PROFILE_S3_OBJECT_KEY}
      original-name: ${DEFAULT_PROFILE_ORIGINAL_NAME}
      file-name: ${DEFAULT_PROFILE_FILE_NAME}
      extension: ${DEFAULT_PROFILE_EXTENSION}
      size: ${DEFAULT_PROFILE_SIZE}
    cors:
      allowed-origins:
        - ${CORS_ALLOWED_ORIGIN_1}
        - ${CORS_ALLOWED_ORIGIN_2}
        - ${CORS_ALLOWED_ORIGIN_3}
        - ${CORS_ALLOWED_ORIGIN_4}