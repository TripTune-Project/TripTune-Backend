spring:
  application:
    name: triptune

  jpa:
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

  mvc:
    throw-exception-if-no-handler-found: true

  web:
    resources:
      add-mappings: false


server:
  error:
    whitelabel:
      enabled: false

logging:
  level:
    org:
      hibernate:
        SQL: debug

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always